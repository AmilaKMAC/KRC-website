<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment</title>

    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css
     ">
</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <div class="container my-5">
        <h2 class="mb-4 text-center">Student Enrollment Form</h2>
        <p class="text-center">Fill in the form below to apply for admission as a student.</p>

        <form class="mx-auto" style="max-width:600px;">
            <div class="mb-3">
                <label for="studentName" class="form-label">Student Name</label>
                <input type="text" class="form-control" id="studentName" required>
            </div>
            <div class="mb-3">
                <label for="grade" class="form-label">Grade Applying For</label>
                <select class="form-select" id="grade" required>
                    <option value="">-- Select Grade --</option>
                    <option value="6">Grade 6</option>
                    <option value="10">O-Level (Grade 10)</option>
                    <option value="12">A-Level (Grade 12)</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="medium" class="form-label">Medium</label>
                <select class="form-select" id="medium" required>
                    <option value="">-- Select Medium --</option>
                    <option value="Sinhala">Sinhala</option>
                    <option value="English">English</option>
                    <option value="Tamil">Tamil</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dob" required>
            </div>
            <div class="mb-3">
                <label for="documents" class="form-label">Upload Required Documents</label>
                <input type="file" class="form-control" id="documents" multiple required>
                <small class="text-muted">Birth certificate, previous school report, NIC, photos</small>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Submit Student Enrollment</button>
            </div>
        </form>
    </div><br><br>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>
</body>

</html>
