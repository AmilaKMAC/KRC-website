<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Enrollment</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>



    <div class="container my-5">
        <h2 class="mb-4 text-center">Parent Feedback Form</h2>
        <p class="text-center">We value your feedback. Please fill in the form below to share your thoughts.</p>

        <form class="mx-auto" style="max-width:600px;">
            <div class="mb-3">
                <label for="parentName" class="form-label">Parent/Guardian Name</label>
                <input type="text" class="form-control" id="parentName" required>
            </div>
            <div class="mb-3">
                <label for="childName" class="form-label">Child's Name</label>
                <input type="text" class="form-control" id="childName" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="feedbackType" class="form-label">Feedback Type</label>
                <select class="form-select" id="feedbackType" required>
                    <option value="">-- Select Type --</option>
                    <option value="suggestion">Suggestion</option>
                    <option value="complaint">Complaint</option>
                    <option value="praise">Praise</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="feedbackMessage" class="form-label">Feedback Message</label>
                <textarea class="form-control" id="feedbackMessage" rows="5" required></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-success">Submit Feedback</button>
            </div>
        </form>
    </div>

    </div><br><br><br>

    <!-- Footer -->
    <div id="footer-placeholder"></div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>


</body>

</html>
